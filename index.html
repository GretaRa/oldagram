<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <script src="https://kit.fontawesome.com/0c7872620e.js" crossorigin="anonymous"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
            <img class="logo" src="images/logo.png" alt="Oldagram logo">
            <a href="#"><img class="user-avatar" src="images/user-avatar.png" alt="Profile picture user"></a>
        </header>
        <main>
            <section class="post">
                <div class="post-header">
                    <img class="user-avatar" src="images/avatar-vangogh.jpg" alt="Profile picture Vincent van Gogh">
                    <div class="user-info">
                        <h1>Vincent van Gogh</h1>
                        <span>Zudert, Netherlands</span>
                    </div>
                </div>
                <img class="post-image" src="images/post-vangogh.jpg" alt="Posted picture by Vincent van Gogh">
                <div class="post-footer">
                    <div class="post-actions">
                    <button aria-label="Like"><i class="fa-regular fa-heart fa-2xl"></i></button>
                    <button aria-label="Comment"><i class="fa-regular fa-comment fa-2xl"></i></button>
                    <button aria-label="Share post"><i class="fa-regular fa-paper-plane fa-2xl"></i></button>
                    </div>
                    <h3 class="likes">21,492 likes</h3>
                    <div class="caption">
                        <h3 class="username">vincey1853</h3>
                        <span>Just took a few mushrooms lol</span>
                    </div>
                </div>
            </section>
        </main>
        <script src="index.js"></script>
    </body>
</html>
